<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Afriquiz — Quiz</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f7f8fc;color:#11121a}

.sidebar{
position:fixed;left:0;top:0;width:235px;height:100vh;
background:#fff;border-right:1px solid #e5e6ee;padding:25px 15px
}

.logo{font-size:23px;font-weight:700;color:#635bff;margin:0 10px 30px}
.user{font-size:14px;font-weight:600;margin:0 10px 20px;color:#555}

.nav a{
display:block;text-decoration:none;color:#555;padding:12px;
margin:4px 0;border-radius:9px;font-size:14px
}

.nav a:hover,.nav a.active{background:#635bff;color:#fff}

.main{margin-left:235px;padding:35px;max-width:1100px}
h1{margin:0 0 7px;font-size:30px}
.subtitle{color:#77798a;margin-bottom:28px}

.filters{display:flex;gap:10px;margin-bottom:25px;flex-wrap:wrap}

.filter{
background:#fff;border:1px solid #e1e2ea;
padding:10px 17px;border-radius:8px;cursor:pointer;color:#555
}

.filter.active{
background:#635bff;color:#fff;border-color:#635bff
}

.quiz-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
gap:18px
}

.quiz-card{
background:#fff;border:1px solid #e5e6ee;
border-radius:14px;padding:22px
}

.quiz-card h2{margin:0 0 10px;font-size:19px}
.quiz-card p{color:#77798a;line-height:1.5;min-height:45px}

.quiz-info{
color:#666;font-size:14px;line-height:1.7;margin:16px 0
}

.start-btn{
width:100%;border:0;background:#635bff;color:#fff;
padding:12px;border-radius:8px;font-weight:600;cursor:pointer
}

.message{
background:#fff;border:1px solid #e5e6ee;
border-radius:14px;padding:40px;text-align:center;color:#77798a
}

@media(max-width:700px){
.sidebar{
position:relative;width:100%;height:auto;
border-right:0;border-bottom:1px solid #e5e6ee
}
.main{margin-left:0;padding:22px 16px}
.nav{display:flex;gap:5px;overflow-x:auto}
.nav a{white-space:nowrap}
}
</style>
</head>

<body>

<aside class="sidebar">

<div class="logo">Afriquiz</div>

<div class="user" id="userName">Utilisateur</div>

<nav class="nav">
<a href="dashboard.html">Accueil</a>
<a href="quiz.html" class="active">Quiz</a>
<a href="#">Compétitions</a>
<a href="#">Mes performances</a>
<a href="#">Mes records</a>
<a href="#">Mes participations</a>
<a href="#">Mon profil</a>
<a href="#" id="logout">Déconnexion</a>
</nav>

</aside>

<main class="main">

<h1>Quiz</h1>

<div class="subtitle">
Teste tes connaissances et améliore tes performances.
</div>

<div class="filters">
<button class="filter active" data-filter="all">Tous</button>
<button class="filter" data-filter="free">Gratuits</button>
<button class="filter" data-filter="paid">Payants</button>
</div>

<div id="quizList" class="quiz-grid">
<div class="message">Chargement des quiz...</div>
</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="quiz.js"></script>

</body>
  </html>
